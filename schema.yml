version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: stg_accounts
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
  - name: stg_transactions
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: amount
        tests: [not_null]
      - name: account_id
        tests:
          - relationships:
              to: ref('stg_accounts')
              field: account_id
  - name: fct_transactions
    columns:
      - name: transaction_id
        tests: [not_null, unique]
  - name: fct_payments
    columns:
      - name: payment_id
        tests: [not_null, unique]
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_account
    columns:
      - name: account_id
        tests: [not_null, unique]
